  proxies: &default [HKG, JPN, SGP, SMART, HK-Basic, SG-Basic, JP-Basic, Manual Choice, Media HKG, Media JPN, 直连, 拒绝]
  type: select

# 功能组
proxies: [{name: 直连, type: direct, icon: *direct}, {name: 拒绝, type: reject, icon: *reject}]
proxy-groups:
  - {name: Instagram, proxies: *default, type: select, icon: *instagram}
  - {name: Telegram, proxies: *default, type: select, icon: *telegram}
  - {name: WhatsApp, proxies: *default, type: select, icon: *whatsapp}
  - {name: Google, proxies: *default, type: select, icon: *google}
  - {name: Emby, proxies: *default, type: select, icon: *emby}
  - {name: FavSites, proxies: *default, type: select, icon: *heart}
  - {name: Notification, proxies: *default, type: select, icon: *imessage}
  - {name: Pornhub, proxies: *default, type: select, icon: *pornhub}
  - {name: TikTok, proxies: *default, type: select, icon: *tiktok}
  - {name: ByteDance, proxies: *default, type: select, icon: *bytedance}
  - {name: ChatGPT, proxies: *default, type: select, icon: *chatgpt}
  - {name: GitHub, proxies: *default, type: select, icon: *github}
  - {name: Twitter, proxies: *default, type: select, icon: *twitter}
  - {name: Test, proxies: *default, type: select, icon: *test}
  - {name: Steam, proxies: *default, type: select, icon: *steam}
  - {name: YouTube, proxies: *default, type: select, icon: *youtube}
  - {name: TVB, proxies: *default, type: select, icon: *tvb}
  - {name: Netflix, proxies: *default, type: select, icon: *netflix}
  - {name: Spotify, proxies: *default, type: select, icon: *spotify}
  - {name: Apple, proxies: *default, type: select, icon: *apple}
  - {name: iCloud, proxies: *default, type: select, icon: *icloud}
  - {name: AppleUpdate, proxies: *default, type: select, icon: *appleupdate}
  - {name: Microsoft, proxies: *default, type: select, icon: *microsoft}
  - {name: Overseas, proxies: *default, type: select, icon: *oversea}
  - {name: CHN, proxies: *default, type: select, icon: *chn}
  - {name: Others, proxies: *default, type: select, icon: *exitrun}
  - {name: AdsBlock, type: select, proxies: *default, icon: *adsblock}
#地区组
  # ONEsmart
  - {name: SMART, <<: *smart, filter: "^(?=.*(PRM|SUF|POR))(?=.*(HKG|SGP|JPN|USA))(?!.*TOP).*$", policy-priority: "Max:0.8;TOP:0.3;", icon: *smartlogo}
  # 香港地区
  - {name: HKG, <<: *smart, filter: "(?=.*(香港|HK|Hong Kong|HKG))(?=.*PRM).*", policy-priority: "TOP:0.3;INT:1.1;", icon: *hkg}
  # 新加坡地区
  - {name: SGP, <<: *smart, filter: "^(?=.*(新加坡|SG|Singapore|SGP))(?=.*PRM).*$", policy-priority: "TOP:0.3;INT:1.3;", icon: *sgp}
  # 日本地区
  - {name: JPN, <<: *smart, filter: "^(?=.*(日本|东京|JP|Japan|JPN))(?=.*PRM).*$", policy-priority: "TOP:0.3;INT:1.3;", icon: *jpn}
  # 新加坡香港BSC混合节点组
  - {name: HK-Basic, <<: *smart, filter: "(?=.*(香港|HK|Hong Kong|HKG))(?=.*BSC).*", icon: *hkg}
  - {name: SG-Basic, <<: *smart, filter: "(?=.*(新加坡|SG|Singapore|SGP))(?=.*BSC).*", icon: *sgp}
  - {name: JP-Basic, <<: *smart, filter: "(?=.*(JPN|日本))(?=.*BSC).*", icon: *jpn}
  - {name: CT, <<: *smart, filter: "(?=.*(SGP|HKG|TWN|KOR))(?=.*BSC)(?=.*CT).*", tolerance: 80, icon: *china-telecom}
  # YouTube节点
  - {name: Media HKG, <<: *smart, filter: "(?=.*(香港|HKG))(?=.*(ASH|BSC|PRO|MDA|SUF))(?!.*(Max|MAX|Top|TOP)).*", icon: *hkg2}
  - {name: Media JPN, <<: *smart, filter: "(?=.*(JPN|日本))(?=.*(ASH|BSC|PRO|MDA|SUF))(?!.*(Max|MAX|Top|TOP)).*", icon: *jpn3}
  # 其他
  - {name: Manual Choice, type: select, filter: "^((?!(拒绝|直连|Bypass|Block)).)*$", include-all: true, icon: *static}


