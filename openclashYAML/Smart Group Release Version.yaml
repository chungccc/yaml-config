#更新日期：2026年10月13日
#订阅健康检查锚点
health-check: &hc {enable: true, url: https://cp.cloudflare.com/generate_204, lazy: true, interval: 300, timeout: 3000}
#url-test策略锚点
urltest: &urltest {type: url-test, include-all: true, url: "https://cp.cloudflare.com/generate_204", interval: 300, tolerance: 20, lazy: true}
# SMART策略 公共参数锚点
smart: &smart {type: smart, uselightgbm: true, collectdata: false, include-all: true, prefer-asn: true, tolerance: 50}

proxy-providers:
  机场A:
    health-check: *hc
    interval: 3000
    path: ./providers/机场A.yaml
    type: http
    url: #删除本注释并填入订阅链接
    filter: '^(?!.*(流量|到期|套餐|官网|刷新|订阅|更新|失联|邮箱|IPV6|官方)).*$' #筛选保留节点 也可以替换成下列filter
    #filter: '^(?!.*(流量|到期|套餐|官网|刷新|订阅|更新|失联|邮箱|IPV6|官方)).*$'
    override:
      additional-prefix: "机场A-" #前缀 用于识别机场
      additional-suffix: "-PRM" #后缀 区分不同等级机场  PRM代表优质 BSC代表基本备用
      proxy-name: #节点关键字替换或者删除-有需要可以保留-可删除-其他机场可以根据节点的实际名称进行调整 目的是让不同的机场节点名称尽量保持统一格式
      - {pattern: "香港", target: "HKG-"} #前面是机场自带关键字 后面是替换
      - {pattern: "韩国", target: "KOR"}
      - {pattern: "马来西亚", target: "MYS"}
      - {pattern: "泰国", target: "THA"}
      - {pattern: "首尔", target: "Soul"}
      - {pattern: "新加坡", target: "SGP-"}
      - {pattern: "日本", target: "JPN-"}
      - {pattern: "台湾", target: "TWN-"}
      - {pattern: "加拿大", target: "CAN-"}
      - {pattern: "英国", target: "GBR-"}
      - {pattern: "美国", target: "USA-"}
      - {pattern: "原生", target: "-Native"}
      - {pattern: "家宽", target: "HOME"}
      - {pattern: "联通", target: "CU"}
      - {pattern: "移动", target: "CM-"}
      - {pattern: "电信", target: "CT"}
      - {pattern: "中转", target: "Relay"}
      - {pattern: "负载", target: "LD-"}
      - {pattern: "荷兰", target: "NLD"}
      - {pattern: "🇨🇳", target: "🇹🇼"} # 旗帜
      - {pattern: "0.5倍率", target: "X0.5"}
      - {pattern: "直连", target: "DIR-"}
      - {pattern: "德国", target: "DEU"}
  机场B:
    health-check: *hc
    interval: 3000
    path: ./providers/机场B.yaml
    type: http
    url: #删除本注释并填入订阅链接
    filter: '^(?!.*(流量|到期|套餐|官网|刷新|订阅|更新|失联|邮箱|IPV6|官方)).*$' #筛选保留节点 也可以替换成下列filter
    #filter: '^(?!.*(流量|到期|套餐|官网|刷新|订阅|更新|失联|邮箱|IPV6|官方)).*$'
    override:
      additional-prefix: "机场B-" #前缀 用于识别机场
      additional-suffix: "-BSC" #后缀 区分不同等级机场
      proxy-name: #节点关键字替换或者删除-有需要可以保留-可删除-其他机场可以根据节点的名称进行调整 目的是让不同的机场节点名称尽量保持统一格式
      - {pattern: "香港", target: "HKG-"} #前面是机场自带关键字 后面是替换
      - {pattern: "韩国", target: "KOR"}
      - {pattern: "马来西亚", target: "MYS"}
      - {pattern: "泰国", target: "THA"}
      - {pattern: "首尔", target: "Soul"}
      - {pattern: "新加坡", target: "SGP-"}
      - {pattern: "日本", target: "JPN-"}
      - {pattern: "台湾", target: "TWN-"}
      - {pattern: "加拿大", target: "CAN-"}
      - {pattern: "英国", target: "GBR-"}
      - {pattern: "美国", target: "USA-"}
      - {pattern: "原生", target: "-Native"}
      - {pattern: "家宽", target: "HOME"}
      - {pattern: "联通", target: "CU"}
      - {pattern: "移动", target: "CM-"}
      - {pattern: "电信", target: "CT"}
      - {pattern: "中转", target: "Relay"}
      - {pattern: "负载", target: "LD-"}
      - {pattern: "荷兰", target: "NLD"}
      - {pattern: "🇨🇳", target: "🇹🇼"} # 旗帜
      - {pattern: "0.5倍率", target: "X0.5"}
      - {pattern: "直连", target: "DIR-"}
      - {pattern: "德国", target: "DEU"}

       
allow-lan: true
  
# P2P下载端口
listeners:
- name: socks5-in-1
  type: socks
  port: 10808
  listen: 0.0.0.0
  udp: true
  users: []
  proxy: DIRECT

dns:
  enable: true
  #  基础模式 
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  ipv6: true
  listen: 0.0.0.0:7874
  fake-ip-filter:  #  fake-ip 例外（不走 fake-ip，直连真实 IP）
    - +.lan
    - +.local
    - geosite:cn
  nameserver:  #  默认 DNS（国内优先，只放国内）
    - 202.96.134.33
    - 202.96.128.86
    - 223.5.5.5           # 阿里 DNS
    - 119.29.29.29        # 腾讯 DNSPod
    - 1.12.12.12          # 腾讯安全 DNS
  nameserver-policy:  #  规则指定 DNS（与官方示例一致）
    '+.arpa': 192.168.2.1
    'geosite:cn':
      - 223.5.5.5
      - 119.29.29.29
  proxy-server-nameserver:  #代理服务器自身域名解析 机场节点用
    - 223.5.5.5
    - 119.29.29.29
  fallback:  #Overseas / 被污染域名兜底 DNS
    - tls://1.1.1.1:853
    - tls://8.8.8.8:853
    - tls://9.9.9.9:853
  fallback-filter:  #什么时候才启用 fallback
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'
#外部控制面板模块
external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
ipv6: true
log-level: info
mixed-port: 7893
mode: rule
port: 7890
profile:
  store-fake-ip: true
  store-selected: true
unified-delay: true # 统一延迟 计算RTT 可选值 true/false
#smart模型更新
lgbm-auto-update: true 
lgbm-update-interval: 48
lgbm-url: "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin"

