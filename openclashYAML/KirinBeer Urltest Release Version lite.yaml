#更新日期：2026年4月9日

#订阅健康检查锚点
health-check: &hc {enable: true, url: https://cp.cloudflare.com/generate_204, lazy: true, interval: 300, timeout: 3000}
#url-test策略锚点
urltest: &urltest {type: url-test, include-all: true, url: "https://cp.cloudflare.com/generate_204", interval: 300, tolerance: 20, lazy: true}
# SMART策略 公共参数锚点
smart: &smart {type: smart, uselightgbm: true, collectdata: false, include-all: true, prefer-asn: true, tolerance: 50}

proxy-providers:
  
  PRO:
    health-check: *hc
    interval: 3000
    path: ./providers/专线.yaml
    type: http
    url: 
    filter: '(香港|日本|新加坡|美国|韩国|台湾|家宽|原生)'
    #filter: '^(?!.*(流量|到期|套餐|官网|刷新|订阅|更新|失联|邮箱|IPV6|官方)).*$'
    override:
      additional-prefix: "PRO-"
      additional-suffix: "-PRM"
      proxy-name:
      - {pattern: "香港", target: "HKG-"}
      - {pattern: "韩国", target: "KOR"}
      - {pattern: "马来西亚", target: "MYS"}
      - {pattern: "泰国", target: "THA"}
      - {pattern: "首尔", target: "Soul"}
      - {pattern: "新加坡", target: "SGP-"}
      - {pattern: "日本", target: "JPN-"}
      - {pattern: "台湾", target: "TWN-"}
      - {pattern: "加拿大", target: "CAN-"}
      - {pattern: "英国", target: "GBR-"}
      - {pattern: "美国", target: "USA-"}
      - {pattern: "原生", target: "-Native"}
      - {pattern: "家宽", target: "Resi"}
      - {pattern: "联通", target: "CU"}
      - {pattern: "移动", target: "CM-"}
      - {pattern: "电信", target: "CT"}
      - {pattern: "中转", target: "Relay"}
      - {pattern: "负载", target: "LD-"}
      - {pattern: "荷兰", target: "NLD"}
      - {pattern: "🇨🇳", target: "🇹🇼"} # 旗帜
      - {pattern: "0.5倍率", target: "X0.5"}
      - {pattern: "直连", target: "DIR-"}
      - {pattern: "BT下载专用", target: "BTDL"}
      - {pattern: "--", target: "-"}
  
  LCB:
    health-check: *hc
    interval: 21600
    path: ./providers/LCB.yaml
    type: http
    url: 
    filter: '(香港|日本|狮城)'
    override:
      additional-prefix: "LCB-"
      additional-suffix: "-PRM"
      proxy-name:
      - {pattern: "香港", target: "-"}
      - {pattern: "狮城", target: "-"}
      - {pattern: "日本", target: "-"}
      - {pattern: " ", target: ""}
      
       
allow-lan: true
# P2P下载端口
listeners:
- name: socks5-in-1
  type: socks
  port: 10808
  listen: 0.0.0.0
  udp: true
  users: []
  proxy: DIRECT

#DNS模块
dns:
  enable: true
  #  基础模式 
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  ipv6: true
  listen: 0.0.0.0:7874
  fake-ip-filter:  #  fake-ip 例外（不走 fake-ip，直连真实 IP）
    - +.lan
    - +.local
    - geosite:cn
  nameserver:  #  默认 DNS（国内优先，只放国内）
    - 202.96.134.33
    - 202.96.128.86
    - 223.5.5.5           # 阿里 DNS
    - 119.29.29.29        # 腾讯 DNSPod
    - 1.12.12.12          # 腾讯安全 DNS
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:  #  规则指定 DNS（与官方示例一致）
    '+.arpa': 192.168.2.1
    'geosite:cn':
      - 223.5.5.5
      - 119.29.29.29
  proxy-server-nameserver:  #代理服务器自身域名解析 机场节点用
    - 'https://doh.pub/dns-query'
    - 223.5.5.5
  proxy-server-nameserver-policy:
    '+.silverleafglow.com':
      - https://dns.ashsub.com/dns-query
      - https://dns1.ashsub.com/dns-query
      - https://dohorigin.ash.do/dns-query
      - https://yichuan.hongtizi.com/dns-query
      - https://yike.hongtizi.com/dns-query
      - https://pebble.flowaccess.org/dns-query
  fallback:  #Overseas / 被污染域名兜底 DNS
    - tls://1.1.1.1:853
    - tls://8.8.8.8:853
    - tls://9.9.9.9:853
  fallback-filter:  #什么时候才启用 fallback
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'

#面板指控
external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
ipv6: true
log-level: info
mixed-port: 7893
mode: rule
port: 7890
profile:
  store-fake-ip: true
  store-selected: true
unified-delay: true # 统一延迟 计算RTT 可选值 true/false
lgbm-auto-update: true #smart模型更新
lgbm-update-interval: 48
lgbm-url: "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin"

