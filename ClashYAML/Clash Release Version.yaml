  - name: AdsBlock
    type: select
    proxies:
      - HKG
      - JPN
      - SGP
      - BSC
      - Manual Choice
      - Bypass
      - Block
    icon: https://fastly.jsdelivr.net/gh/shindgew/WHATSINStash/icon/adguard.png
  - name: HKG
    type: url-test
    include-all: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 20
    lazy: true
    filter: ^(?=.*(香港|HK|Hong Kong|HKG))(?=.*PRM).*$
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Hong_Kong.png
  - name: SGP
    type: url-test
    include-all: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 20
    lazy: true
    filter: ^(?=.*(新加坡|SG|Singapore|SGP))(?=.*PRM).*$
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Singapore.png
  - name: JPN
    type: url-test
    include-all: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 20
    lazy: true
    filter: ^(?=.*(日本|东京|JP|Japan|JPN))(?=.*PRM).*$
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Japan.png
  - name: BSC
    type: select
    filter: ^(?=.*(香港|HK|Hong Kong|HKG|JPN))(?=.*BSC).*$
    include-all: true
    icon: https://fastly.jsdelivr.net/gh/chungccc/IconSet@main/smart2.png
  - name: Manual Choice
    type: select
    filter: ^((?!(拒绝|直连|Bypass|Block|HKG|JPN|SGP)).)*$
    include-all: true
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Static.png
  - name: Bypass
    type: select
    proxies:
      - 直连
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Direct.png
  - name: Block
    type: select
    proxies:
      - 拒绝
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Reject.png
