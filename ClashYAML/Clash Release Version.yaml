
proxy-providers:
  SUFE:
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      lazy: true
      interval: 300
      timeout: 3000
    interval: 86400
    path: ./providers/SUFE.yaml
    type: http
    url: 
    filter: (香港|新加坡|日本)
    override:
      additional-prefix: SUF-
      additional-suffix: -PRM
  LXY:
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      lazy: true
      interval: 300
      timeout: 3000
    interval: 86400
    path: ./providers/LXY2.yaml
    type: http
    url: 
    filter: (香港|新加坡|日本)
    override:
      additional-prefix: LXY-
      additional-suffix: -BSC
allow-lan: true
listeners:
  - name: socks5-in-1
    type: socks
    port: 10808
    listen: 0.0.0.0
    udp: true
    users: []
    proxy: DIRECT
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  ipv6: true
  listen: 0.0.0.0:7874
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn
  nameserver:
    - 202.96.134.33
    - 202.96.128.86
    - 223.5.5.5
    - 119.29.29.29
    - 1.12.12.12
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    +.arpa: 192.168.2.1
    geosite:cn:
      - 223.5.5.5
      - 119.29.29.29
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - 223.5.5.5
  fallback:
    - tls://1.1.1.1:853
    - tls://8.8.8.8:853
    - tls://9.9.9.9:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    domain:
      - +.google.com
      - +.facebook.com
      - +.youtube.com
ipv6: true
log-level: info
mixed-port: 7893
mode: rule
port: 7890
profile:
  store-fake-ip: true
  store-selected: true
unified-delay: true
default:
  proxies:
    - HKG
    - JPN
    - SGP
    - BSC
    - Manual Choice
    - Bypass
    - Block
  type: select
proxies:
  - name: 直连
    type: direct
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Direct.png
  - name: 拒绝
    type: reject
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Reject.png
